<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KONAK ERP | Mağaza Şifre Sıfırlama</title><link rel="stylesheet" href="./style.css?v=mobile-fit-1"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script><style>#request-form[hidden],#update-form[hidden]{display:none!important}</style></head>
<body><header class="topbar"><div class="shell navline"><a class="brand" href="./"><b>KONAK<span> ERP</span></b><small>Perde Mağazası Yönetimi</small></a></div></header>
<main class="shell"><section class="auth card" style="margin:70px auto;max-width:610px"><h1>Mağaza Şifre Sıfırlama</h1><p>Mağaza girişinde kullandığınız e-posta adresini yazın. Şifre yenileme bağlantısı e-postanıza gönderilir.</p>
<form id="request-form"><label>E-posta<input id="email" name="email" type="email" required autocomplete="email" placeholder="E-posta adresiniz"></label><button id="send-button" type="submit" class="primary">Sıfırlama Bağlantısı Gönder</button></form>
<form id="update-form" hidden><p>Yeni şifrenizi oluşturun.</p><label>Yeni Şifre<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Yeni Şifre (Tekrar)<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button type="submit" class="primary">Şifreyi Güncelle</button></form>
<p id="status" class="message" role="status" aria-live="polite"></p><p style="text-align:center;margin-top:22px"><a href="./" style="color:#1c3b2f;text-decoration:underline">Mağaza Girişine Dön</a></p></section></main>
<script>
window.addEventListener('load',async()=>{
const status=document.getElementById('status'),request=document.getElementById('request-form'),update=document.getElementById('update-form'),params=new URLSearchParams(location.search);
const sb=window.supabase?.createClient('https://rwylhxrtggsicieuyjrm.supabase.co','sb_publishable_ZuVtzdkaKytcl7i4rWcEuQ_XWgA28sA',{auth:{detectSessionInUrl:true,flowType:'implicit'}});
if(!sb){status.textContent='Bağlantı kurulamadı. Sayfayı yenileyip tekrar deneyin.';return}
const recovery=params.has('reset')||params.has('token_hash')||location.hash.includes('type=recovery');
if(recovery){request.hidden=true;update.hidden=false;status.textContent='E-postanızdaki bağlantıdan geldiyseniz yeni şifrenizi belirleyebilirsiniz.'}
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){request.hidden=true;update.hidden=false;status.textContent='Bağlantı doğrulandı. Yeni şifrenizi belirleyin.'}});
if(params.has('token_hash')&&params.get('type')==='recovery'){
const {error}=await sb.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});
if(error)status.textContent='Bağlantı geçersiz veya süresi dolmuş: '+error.message;
else {request.hidden=true;update.hidden=false;status.textContent='Bağlantı doğrulandı.'}
}
request.addEventListener('submit',async e=>{
e.preventDefault();const button=document.getElementById('send-button');button.disabled=true;status.textContent='İstek gönderiliyor...';
const email=document.getElementById('email').value.trim();
try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://perdekonagi.com/magaza/reset-password.html?reset=1'});if(error)throw error;status.textContent='İstek alındı. Hesap kayıtlıysa şifre sıfırlama e-postası gönderilir. Gelen kutunuzu ve spam klasörünü kontrol edin.'}
catch(err){const message=err?.message||'Bilinmeyen hata';status.textContent=/after \d+ seconds|rate limit|too many/i.test(message)?'Çok sık istek gönderildi. Lütfen biraz bekleyip yeniden deneyin.':'Bağlantı gönderilemedi: '+message}
finally{button.disabled=false}
});
update.addEventListener('submit',async e=>{
e.preventDefault();const data=new FormData(update),password=String(data.get('password')||''),confirm=String(data.get('confirm')||'');
if(password!==confirm){status.textContent='Şifreler eşleşmiyor.';return}
const button=update.querySelector('button');button.disabled=true;status.textContent='Şifre güncelleniyor...';
try{const {error}=await sb.auth.updateUser({password});if(error)throw error;status.textContent='Şifreniz güncellendi. Mağaza girişine dönebilirsiniz.';update.hidden=true;history.replaceState(null,'',location.pathname)}
catch(err){status.textContent='Şifre güncellenemedi: '+(err?.message||'Bağlantı süresi dolmuş olabilir. Yeniden sıfırlama isteyin.')}
finally{button.disabled=false}
});
});
</script></body></html>
