<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KONAK ERP | Mağaza Yönetimi</title>
<link rel="stylesheet" href="./style.css?v=mobile-1">
<style>
html,body{margin:0;min-height:100%;overflow:hidden;background:#f6f8f7;font-family:Arial,sans-serif}
.erp-shell-guest .erp-shell-nav,.erp-shell-guest .erp-mobile-toggle,.erp-shell-guest .erp-shell-account-wrap,.erp-shell-account-wrap[hidden]{display:none!important}
.erp-shell-top{position:relative;z-index:50;height:76px;background:#fff;border-bottom:1px solid #e0e6e1;display:flex;align-items:center;justify-content:center}
.erp-shell-bar{width:min(1300px,calc(100% - 32px));display:flex;align-items:center;gap:26px}
.erp-shell-brand{flex-shrink:0;text-decoration:none;color:#203d32;font-size:22px;font-weight:800;line-height:1.1}
.erp-shell-brand span{color:#a87538}
.erp-shell-brand small{display:block;font-size:9px;font-weight:400;letter-spacing:1px;color:#8e948f;margin-top:5px}
.erp-shell-nav{flex:1;min-width:0;display:flex;align-items:center;gap:7px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth}
.erp-shell-scroll{flex:0 0 28px;width:28px;height:39px;border:1px solid #dce5de;border-radius:8px;background:#fff;color:#203d32;font-size:20px;font-weight:700;cursor:pointer}
.erp-shell-scroll[hidden]{display:none!important}
.erp-shell-scroll:disabled{opacity:.35;cursor:default}
.erp-shell-nav::-webkit-scrollbar{display:none}
.erp-shell-nav a{white-space:nowrap;background:#1e3c2f;border-radius:8px;color:white;text-decoration:none;padding:12px 11px;font-weight:700;font-size:12px}
.erp-shell-nav a[aria-current=page]{background:#b17b43}
.erp-shell-nav a[hidden]{display:none}
.erp-shell-account{color:#203a30;text-decoration:none;white-space:nowrap;border:1px solid #dce5de;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600}
.erp-shell-account-wrap{position:relative;flex-shrink:0}
.erp-shell-account{background:#fff;cursor:pointer;font-family:inherit}
.erp-shell-account-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;background:#fff;border:1px solid #dce5de;box-shadow:0 12px 28px #0000001b;border-radius:12px;min-width:188px;padding:6px}
.erp-shell-account-menu[hidden]{display:none}
.erp-shell-account-menu a,.erp-shell-account-menu button{display:block;width:100%;box-sizing:border-box;text-align:left;border:0;border-radius:8px;padding:11px 12px;background:#fff;color:#203a30;font:600 13px Arial,sans-serif;text-decoration:none;cursor:pointer}
.erp-shell-account-menu a:hover,.erp-shell-account-menu button:hover,.erp-shell-account-menu a:focus-visible,.erp-shell-account-menu button:focus-visible{background:#ecf3ee}
.erp-mobile-toggle{display:none;border:1px solid #dce5de;border-radius:10px;background:white;color:#203a30;font-size:21px;line-height:1;padding:9px 11px;cursor:pointer}
.erp-shell-stage{position:relative;height:calc(100dvh - 76px);background:#f5f7f6}
.erp-shell-page{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#f5f7f6}
.erp-shell-page.active{display:block}
.erp-shell-notice{position:absolute;top:12px;right:20px;z-index:5;background:#fff;border:1px solid #dce5de;border-radius:10px;padding:9px 14px;font-size:12px;color:#3b5145;box-shadow:0 4px 12px #00000012}
.erp-shell-error{margin:80px auto;max-width:450px;background:#fff;padding:30px;border-radius:16px;text-align:center}
@media(max-width:900px){.erp-shell-top{height:66px}.erp-shell-bar{width:calc(100% - 18px);gap:8px}.erp-shell-brand{font-size:16px}.erp-shell-brand small{font-size:7px}.erp-shell-nav a{font-size:11px;padding:11px}.erp-shell-account{font-size:11px;padding:9px}.erp-shell-stage{height:calc(100dvh - 66px)}}
@media(max-width:760px){
 .erp-shell-top{height:62px}
 .erp-shell-bar{width:calc(100% - 24px);gap:8px}
 .erp-shell-brand{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis}
 .erp-shell-brand small{font-size:7px;letter-spacing:.6px}
 .erp-mobile-toggle{display:block;margin-left:auto;flex-shrink:0}
 .erp-shell-account{font-size:12px;padding:10px 11px}
 .erp-shell-scroll{display:none!important}
 .erp-shell-nav{display:none!important;position:absolute;left:0;right:0;top:100%;background:#fff;border-top:1px solid #e4eae5;box-shadow:0 14px 24px #11291a22;padding:12px;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:min(65dvh,480px);overflow-y:auto}
 .erp-shell-nav.open{display:grid!important}
 .erp-shell-nav a{font-size:13px;text-align:center;padding:13px 7px;min-width:0}
 .erp-shell-account-menu{min-width:168px}
 .erp-shell-stage{height:calc(100dvh - 62px)}
}
@media(max-width:380px){.erp-shell-brand{font-size:16px}.erp-shell-brand small{font-size:6px}.erp-shell-account{padding:9px 7px;font-size:11px}}
</style>
<script>
(function(){
 var clientSources=[
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js",
  "https://unpkg.com/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"
 ];
 var started=false,attempt=0,done=false,scriptLoader=null;
 var notice=document.getElementById("erp-shell-notice");
 function recovery(note){
  if(!notice)return;
  notice.hidden=false;
  notice.replaceChildren();
  var wrap=document.createElement("div");wrap.style.cssText="display:grid;gap:11px;max-width:400px;text-align:center";
  var title=document.createElement("strong");title.textContent="KONAK ERP açılıyor";
  var details=document.createElement("span");details.style.cssText="color:#526a5b;font-size:13px;line-height:1.5";details.textContent=note;
  var actions=document.createElement("div");actions.style.cssText="display:flex;flex-wrap:wrap;justify-content:center;gap:9px";
  var retry=document.createElement("button");retry.type="button";retry.textContent="Yeniden Dene";retry.style.cssText="background:#234a35;color:#fff;padding:11px;border-radius:8px;border:0;font-weight:700";retry.onclick=function(){location.reload()};
  var direct=document.createElement("a");direct.href="../erp/";direct.textContent="Giriş Sayfası";direct.style.cssText="background:#e9f1e9;color:#234a35;padding:11px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px";
  actions.append(retry,direct);wrap.append(title,details,actions);notice.append(wrap);
 }
 function loadShell(){
  if(started)return;started=true;
  recovery("Bağlantı kuruldu, sipariş ekranı yükleniyor...");
  var s=document.createElement("script");s.src="./erp-shell.js?v=boot-fallback-20261128";s.onerror=function(){recovery("Giriş ekranının uygulama dosyası yüklenemedi. Sayfayı yeniden deneyin.")};
  document.head.append(s);
 }
 function attemptSource(){
  if(started||done)return;
  if(window.supabase&&window.supabase.createClient){loadShell();return}
  if(attempt>=clientSources.length){done=true;recovery("Giriş bağlantısı kurulamadı. İnternet bağlantınızı kontrol edip yeniden deneyin.");return}
  var source=clientSources[attempt++],s=document.createElement("script"),settled=false;
  s.src=source;s.async=true;
  var watchdog=setTimeout(function(){finish(false)},7000);
  function finish(success){
   if(settled)return;settled=true;clearTimeout(watchdog);
   if(success&&(window.supabase&&window.supabase.createClient)){loadShell();return}
   if(s.parentNode)s.parentNode.removeChild(s);
   attemptSource();
  }
  s.onload=function(){finish(true)};
  s.onerror=function(){finish(false)};
  document.head.append(s);
 }
 recovery("Güvenli giriş bağlantısı hazırlanıyor...");
 attemptSource();
})();
</script>
</head>

<script>setTimeout(function(){var n=document.getElementById('erp-shell-notice');if(!n||n.hidden)return;if(n.textContent.includes('hazırlanıyor')||n.textContent.includes('Bölüm açılıyor')){n.replaceChildren();var d=document.createElement('div');d.style.cssText='max-width:360px;text-align:center;line-height:1.6';d.textContent='KONAK ERP bağlantısı gecikiyor. ';var a=document.createElement('a');a.href='../erp/';a.textContent='Giriş sayfasına git';a.style.cssText='display:block;margin-top:8px;color:#22513a;font-weight:bold';d.append(a);var b=document.createElement('button');b.textContent='Yeniden Dene';b.style.cssText='display:block;margin:10px auto;padding:9px 16px;background:#20513a;color:white;border:0;border-radius:8px';b.onclick=function(){location.reload()};d.append(b);n.append(d)}},14000);</script>
<script>(function(){const nav=document.getElementById("erp-mobile-navigation"),prev=document.getElementById("erp-nav-prev"),next=document.getElementById("erp-nav-next");function refresh(){const isMobile=matchMedia("(max-width:760px)").matches;const overflow=!isMobile&&nav.scrollWidth>nav.clientWidth+2;prev.hidden=!overflow;next.hidden=!overflow;prev.disabled=nav.scrollLeft<3;next.disabled=nav.scrollLeft+nav.clientWidth>=nav.scrollWidth-3}prev.addEventListener("click",()=>nav.scrollBy({left:-Math.max(180,nav.clientWidth*.65),behavior:"smooth"}));next.addEventListener("click",()=>nav.scrollBy({left:Math.max(180,nav.clientWidth*.65),behavior:"smooth"}));nav.addEventListener("scroll",refresh,{passive:true});window.addEventListener("resize",refresh);new MutationObserver(refresh).observe(nav,{childList:true,subtree:true,attributes:true,attributeFilter:["hidden","style"]});requestAnimationFrame(refresh);setTimeout(refresh,700)})();</script>
</body></html>
