<main id="app" hidden><div class="heading"><div><div class="muted">Ölçü alma ve montaj takibi</div><h1>Montaj Randevu</h1><p>Evde ölçü ve montaj taleplerini şubeye göre kaydedin.</p></div><button type="button" class="primary" id="new">+ Yeni Randevu</button></div>
<section class="filters panel"><label>İşletme<select id="organization"></select></label><label>Şube<select id="branch-filter"></select></label><label>İşlem türü<select id="type-filter"><option value="">Tüm Talepler</option><option value="measurement">Ölçü Alma</option><option value="installation">Montaj</option></select></label></section>
<p id="message" class="notice" role="status"></p><section id="list" class="records"></section></main><main id="auth">Montaj randevuları yükleniyor…</main>
<dialog id="dialog"><div class="dialoginner"><div class="dialoghead"><h2 id="form-heading">Yeni Randevu</h2><button id="close" type="button" aria-label="Kapat">✕</button></div><p>Talep sahibinin iletişim ve ziyaret bilgileri</p>
<form id="form"><div class="formgrid"><label>Talep Türü *<select name="appointment_type" required><option value="measurement">Evde Ölçü Alma</option><option value="installation">Montaj</option></select></label><label>Şube *<select name="branch_id" id="form-branch" required></select></label>
<label>Adı Soyadı *<input name="customer_name" required minlength="2" maxlength="160" autocomplete="name"></label><label>Telefon Numarası *<input name="customer_phone" type="tel" required minlength="7" maxlength="30" autocomplete="tel" inputmode="tel"></label>
<label class="wide">Ev Adresi *<textarea name="customer_address" required minlength="8" maxlength="2000" rows="3" autocomplete="street-address" placeholder="Mahalle, sokak, bina no, daire, ilçe / il"></textarea></label>
<label>Randevu Tarihi<input name="appointment_date" type="date"></label><label>Randevu Saati<input name="appointment_time" type="time"></label>
<label>Durum<select name="status"><option value="pending">Bekliyor</option><option value="scheduled">Planlandı</option><option value="completed">Tamamlandı</option><option value="cancelled">İptal</option></select></label><label>Not<input name="notes" maxlength="2000" placeholder="Ulaşım, ürün veya açıklama"></label></div><p id="form-message" class="notice" role="status"></p><div class="formactions"><button type="button" id="cancel">Vazgeç</button><button type="submit" class="primary" id="save">Kaydet</button></div></form>
</div></dialog><script src="./appointments.js?v=whatsapp-popup-fix-20261118" defer></script></body></html>
